name: Manual SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      pr_id:
        description: 'Pull Request ID to analyze'
        required: true
        type: string

jobs:
  sonar-analysis:
    name: SonarCloud Analysis for PR
    runs-on: ubuntu-latest

    steps:
    - name: Get PR details
      id: pr
      uses: actions/github-script@v9
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: ${{ inputs.pr_id }}
          });
          core.setOutput('head_ref', pr.data.head.ref);
          core.setOutput('base_ref', pr.data.base.ref);
          core.setOutput('head_sha', pr.data.head.sha);

    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0

    - name: Set up Go 1.26.5
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'

    - name: Build
      run: go build -v ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

    - name: Test
      run: go test -p 1 -v ./... -coverprofile="coverage.out"

    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      if: env.SONAR_TOKEN != ''
      with:
        args: >
          -Dsonar.pullrequest.key=${{ inputs.pr_id }}
          -Dsonar.pullrequest.branch=${{ steps.pr.outputs.head_ref }}
          -Dsonar.pullrequest.base=${{ steps.pr.outputs.base_ref }}

    - name: Vulnerability Check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f
        govulncheck ./...