name: Master CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'

    - name: Build
      run: go build -v ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0

    - name: Format
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not formatted correctly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Test
      run: go test -p 1 -v ./... -coverprofile="coverage.out"

    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      if: env.SONAR_TOKEN != ''

    - name: Vulnerability Check v1.8.0
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c
        govulncheck ./...

  build-test:
    name: Build & Test - Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.25.10', '1.26.6', '1.27.1']

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -p 1 -v ./...
