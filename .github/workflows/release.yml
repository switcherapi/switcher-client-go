name: Release CI

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Module Version
    runs-on: ubuntu-latest

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Set up Go 1.26.5
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'

    - name: Validate tag is semver
      run: |
        tag="${{ github.event.release.tag_name }}"
        if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '$tag' is not a valid semantic version (expected vX.Y.Z, e.g. v1.2.3)."
          exit 1
        fi

    - name: Validate module path matches major version
      run: |
        tag="${{ github.event.release.tag_name }}"
        major="${tag#v}"
        major="${major%%.*}"
        module_path=$(go list -m)
        if [ "$major" -ge 2 ]; then
          expected_suffix="/v${major}"
          if [[ "$module_path" != *"$expected_suffix" ]]; then
            echo "::error::Tag major version is v${major}, but module path '$module_path' does not end with '$expected_suffix'. See https://go.dev/doc/modules/major-version"
            exit 1
          fi
        else
          if [[ "$module_path" =~ /v[0-9]+$ ]]; then
            echo "::error::Tag major version is v${major}, but module path '$module_path' has an unexpected version suffix."
            exit 1
          fi
        fi

    - name: Verify go.mod/go.sum are tidy
      run: |
        go mod tidy
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the changes before tagging a release."
          git diff go.mod go.sum
          exit 1
        fi

  build-test:
    name: Build & Test - Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [validate-release]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.25.10', '1.26.5']

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -p 1 -v ./...

  lint-vuln:
    name: Lint, Format & Vulnerability Check
    runs-on: ubuntu-latest
    needs: [validate-release]

    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go 1.26.5
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'

    - name: Build
      run: go build -v ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

    - name: Format
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not formatted correctly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Vulnerability Check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f
        govulncheck ./...

  provenance:
    name: Attest Build Provenance
    needs: [build-test, lint-vuln]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go 1.26.5
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'

    - name: Verify module & generate checksums
      run: |
        go mod verify
        go build -v ./...
        go mod download
        {
          echo "switcher-client-go ${{ github.ref_name }}"
          echo "commit: ${{ github.sha }}"
          echo
          sha256sum go.mod go.sum > checksums.txt
          cat checksums.txt
        }

    - name: Generate SLSA build provenance
      id: attest
      uses: actions/attest@v4
      with:
        subject-path: checksums.txt

    - name: Upload provenance & checksums to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          checksums.txt \
          "${{ steps.attest.outputs.bundle-path }}#attestation.intoto.jsonl" \
          --clobber

  publish-index:
    name: Publish to Go Module Index
    needs: [provenance]
    runs-on: ubuntu-latest

    steps:
    - name: Set up Go 1.26.5
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'

    - name: Notify Go module proxy
      run: |
        GOPROXY=proxy.golang.org go list -m github.com/switcherapi/switcher-client-go@${{ github.event.release.tag_name }}
